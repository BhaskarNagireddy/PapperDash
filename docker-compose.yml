# Local development infrastructure. Start with: pnpm dev:infra
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: papperdash
      POSTGRES_PASSWORD: papperdash
      POSTGRES_DB: papperdash
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:

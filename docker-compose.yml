# Local development infrastructure. Start with: pnpm dev:infra
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: papperdash
      POSTGRES_PASSWORD: papperdash
      POSTGRES_DB: papperdash
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    # S3-compatible document storage for local development (console on :9001).
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: papperdash
      MINIO_ROOT_PASSWORD: papperdash-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-setup:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 3 && mc alias set local http://minio:9000 papperdash papperdash-dev-secret &&
             mc mb --ignore-existing local/papperdash-documents"
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
  miniodata:

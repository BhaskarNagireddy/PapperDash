name: CI

# Every pull request and every push to main runs these checks. Branch protection requires all of them
# to pass before anything merges into main (docs/engineering/testing.md explains each one).

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repository unless they say otherwise.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, block boundaries and committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    name: Build, typecheck and migration check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Migrations are up to date with the schema
        working-directory: services/core
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::Schema changed without a migration: run pnpm --filter @papperdash/core db:generate"
            exit 1
          fi

  tests:
    name: Unit and integration tests with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # coverage report comment on the PR
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: Install LibreOffice Writer (Word-to-PDF conversion tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui
      - run: pnpm install --frozen-lockfile
      - name: Run all tests with coverage (fails below the minimum coverage)
        run: pnpm test:coverage
      - name: Coverage report on the PR (core)
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: core
          working-directory: services/core
          file-coverage-mode: changes
      - name: Coverage report on the PR (contracts)
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: contracts
          working-directory: packages/contracts
          file-coverage-mode: changes
      - name: Keep test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            services/core/reports/
            services/core/coverage/
            packages/contracts/reports/
            packages/contracts/coverage/
          retention-days: 30

  integration-postgres:
    name: Integration tests on PostgreSQL 16 and S3 (MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      S3_TEST_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: papperdash
      AWS_SECRET_ACCESS_KEY: papperdash-ci-secret
      AWS_REGION: eu-north-1
      MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
    steps:
      - uses: actions/checkout@v7
      # MinIO is now distributed as source only, so CI builds a pinned release once and caches the binary.
      - name: Cache MinIO build
        id: minio-cache
        uses: actions/cache@v6
        with:
          path: ~/minio-bin
          key: minio-${{ env.MINIO_RELEASE }}
      - uses: actions/setup-go@v7
        if: steps.minio-cache.outputs.cache-hit != 'true'
        with: { go-version: '1.24', cache: false }
      - name: Build MinIO ${{ env.MINIO_RELEASE }}
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MINIO_RELEASE" https://github.com/minio/minio.git /tmp/minio-src
          cd /tmp/minio-src && CGO_ENABLED=0 go build -trimpath -o ~/minio-bin/minio .
      - name: Start MinIO (S3-compatible storage)
        run: |
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=$AWS_ACCESS_KEY_ID MINIO_ROOT_PASSWORD=$AWS_SECRET_ACCESS_KEY \
            nohup ~/minio-bin/minio server /tmp/minio-data --address :9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          cat /tmp/minio.log; exit 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: Install LibreOffice Writer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @papperdash/contracts build
      - name: Integration tests against PostgreSQL 16 and MinIO
        run: pnpm --filter @papperdash/core test:integration

  security:
    name: Security scans (secrets, code, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # secrets are searched in the whole history, not just the latest commit
      - name: Secrets in git history (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Security bugs in the code (Semgrep)
        run: |
          python3 -m pip install --quiet semgrep
          # The two excluded rules are njsscan's "good practice detected" confirmations (the CSP and X-Powered-By
          # protections are present), not problems; every other rule blocks the merge.
          semgrep scan --metrics=off --error \
            --config p/typescript --config p/nodejsscan --config p/jwt --config p/secrets \
            --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_check_csp \
            --exclude-rule ajinabraham.njsscan.good.good_helmet_checks.helmet_header_x_powered_by \
            services packages scripts
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: Known vulnerabilities in production dependencies (pnpm audit, high and critical)
        run: pnpm audit --prod --audit-level high

  docker:
    name: Docker image (build, boot, vulnerability scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: papperdash }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/papperdash
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -f services/core/Dockerfile -t papperdash-core:ci .
      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id papperdash-core:ci -u)" != "0"
      - name: Applies migrations to PostgreSQL 16
        run: docker run --rm --network host -e DATABASE_URL papperdash-core:ci node dist/migrate.js
      - name: Boots and reports ready
        id: boot
        run: |
          docker run -d --name core --network host -e DATABASE_URL -e NODE_ENV=development -e PORT=4000 papperdash-core:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health/ready; then echo; exit 0; fi
            sleep 1
          done
          docker logs core; exit 1
      - name: Sends security headers and hides the framework
        run: |
          headers=$(curl -sI http://localhost:4000/health)
          echo "$headers"
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          ! echo "$headers" | grep -qi '^x-powered-by'
      - name: Refuses unsafe production settings
        run: |
          if docker run --rm --network host -e DATABASE_URL papperdash-core:ci > out.txt 2>&1; then
            echo "::error::The image started in production mode without S3, KMS, SES and https"; cat out.txt; exit 1
          fi
          grep -q "Refusing to start in production" out.txt
      - name: Vulnerability report (high, for information)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: papperdash-core:ci
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table
      - name: Vulnerability gate (fails on fixable critical issues)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: papperdash-core:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          skip-setup-trivy: true
      - name: Container logs
        if: failure() && steps.boot.outcome == 'failure'
        run: docker logs core || true
